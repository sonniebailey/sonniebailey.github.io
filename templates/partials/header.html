<header>
    <div class="container">
        {% include "partials/logo.html" %}

        <nav class="nav-desktop" aria-label="Primary">
            {% for item in site.nav %}
            <a href="{{ item.href }}"{% if page.url == item.href %} class="is-current" aria-current="page"{% endif %}>{{ item.label }}</a>
            {% endfor %}
            <a href="tel:{{ site.phone.tel }}" class="nav-phone">{{ site.phone.display }}</a>
        </nav>


        <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

    {% if site.banner %}
    <div class="site-banner" role="status">{{ site.banner }}</div>
    {% endif %}
</header>

<nav id="mobile-menu" hidden aria-label="Mobile">
    <button type="button" class="menu-close" aria-label="Close menu">&times;</button>
    <div class="mobile-nav">
        {% for item in site.nav %}
        <a href="{{ item.href }}"{% if page.url == item.href %} class="is-current" aria-current="page"{% endif %}>{{ item.label }}</a>
        {% endfor %}
        <a href="tel:{{ site.phone.tel }}" class="nav-phone">{{ site.phone.display }}</a>
    </div>
</nav>
