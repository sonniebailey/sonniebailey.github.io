{# Light/dark switch. Included in both the desktop header and the mobile
   menu. Both icons are always in the markup; components.css shows the one
   matching the current theme. aria-label and aria-pressed are set by
   js/theme.js once it loads. #}
<button type="button" class="theme-toggle" aria-label="Switch theme">
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
    </svg>
</button>
