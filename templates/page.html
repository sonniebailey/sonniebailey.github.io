{% extends "base.html" %}
{% block main %}
<div class="container">
    <div class="page-heading">
        <div class="page-heading__text">
            <h1 class="page-heading__title">{{ hero_title }}</h1>
            {% if page.intro %}
            <p class="page-heading__intro">{{ page.intro }}</p>
            {% endif %}
        </div>
        {% if page.cta %}
        <a href="{{ page.cta.href }}" class="hero__cta"><span class="hero__cta-label">{{ page.cta.label }}</span></a>
        {% endif %}
        {% include "partials/capacity_dialog.html" %}
    </div>
    <div class="prose">
        {{ content }}
    </div>

    {% if site.map and page.show_map %}
    <div class="map-embed">
        <iframe
            src="{{ site.map.embed_url }}"
            title="Map showing the location of {{ site.name }}"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen></iframe>
    </div>
    {% endif %}
</div>
{% endblock %}
